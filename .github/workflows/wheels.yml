name: Build wheels

# Builds the platform wheels and the sdist as artifacts on every run. A v*
# tag also publishes them to PyPI, through the `gate` and `publish` jobs at
# the end (same shape as fvutils/dv-solve's wheels.yml).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "c/**"
      - "vpi/**"
      - "sv/src/**"
      - "python/src/trlog/_libpath.py"
      - "python/src/trlog/__version__.py"
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - "ivpm.yaml"
      - "tests/wheel_smoke.py"
      - "wasm/**"
      - "ts/**"
      - "scripts/wasm-env.sh"
      - ".github/workflows/wheels.yml"

# A newer push to the same ref cancels the older (slow, emulated) builds.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux wheels build inside manylinux containers: the two most recent
          # baselines per arch (full quay.io paths; cibuildwheel has no 2_34
          # alias). aarch64 runs under QEMU.
          - { name: linux-x86_64-2_34,  os: ubuntu-latest, archs: x86_64,  image: quay.io/pypa/manylinux_2_34_x86_64 }
          - { name: linux-x86_64-2_28,  os: ubuntu-latest, archs: x86_64,  image: quay.io/pypa/manylinux_2_28_x86_64 }
          - { name: linux-aarch64-2_34, os: ubuntu-latest, archs: aarch64, image: quay.io/pypa/manylinux_2_34_aarch64 }
          - { name: linux-aarch64-2_28, os: ubuntu-latest, archs: aarch64, image: quay.io/pypa/manylinux_2_28_aarch64 }
          - { name: macos-arm64,        os: macos-15,      archs: arm64 }
          # Required for the first release: `publish` needs this job, so a
          # Windows failure blocks the release instead of shipping without it.
          - { name: windows-AMD64,      os: windows-latest, archs: AMD64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (Linux emulated arches)
        if: runner.os == 'Linux' && matrix.archs != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Install cmake/ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch zlib + lz4 sources
        # c/cmake/trl_deps.cmake builds them from packages/, which only
        # `ivpm update` creates. The `default` dep-set is just these two;
        # --py-skip-install skips the venv (cibuildwheel provides the build
        # requirements). On Linux cibuildwheel copies packages/ into the
        # container with the project. pipx, not pip: Homebrew's python3 on
        # macOS refuses pip installs (PEP 668).
        run: pipx run ivpm update -d default -a --py-skip-install

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
          # Empty (and ignored) on macOS/Windows.
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.image }}
          CIBW_MANYLINUX_AARCH64_IMAGE: ${{ matrix.image }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  # macOS Intel: slow to schedule, so tags and manual runs only. The timeout
  # turns a retired runner label into a failure instead of a six-hour queue.
  build_wheels_macos_intel:
    name: macos-x86_64
    if: github.event_name != 'pull_request'
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install cmake/ninja
        run: brew install cmake ninja
      - name: Fetch zlib + lz4 sources
        run: pipx run ivpm update -d default -a --py-skip-install
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # MANIFEST.in puts the zlib/lz4 sources from packages/ in the sdist, so
      # it builds from source without ivpm.
      - name: Fetch zlib + lz4 sources
        run: pipx run ivpm update -d default -a --py-skip-install
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  # The npm package @fvutils/trlog: libtrl compiled to WebAssembly plus the
  # TypeScript API in ts/. Built and tested on every run; the tarball is an
  # artifact, and `publish` uploads that same tarball on a tag, so what is
  # published is what was tested here.
  build_npm:
    name: npm package (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Emscripten + zlib/lz4 sources
        # `ts-build` = default + wasm-build (emsdk, Linux x86_64 only).
        # ivpm records the dep-set in packages/ivpm.json and refuses a later
        # run asking for another, so this is the only set fetched here.
        run: pipx run ivpm update -d ts-build -a --py-skip-install

      - name: Set the package version from the tag
        # Tags only; other runs build 0.0.0. `publish` checks the tag against
        # __version__.py, so the npm and PyPI versions agree on a release.
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ts
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Build (wasm + TypeScript)
        # `npm ci` runs the `prepare` hook (scripts/prepare.mjs), which finds
        # packages/emsdk and runs gen:wasm (scripts/build-wasm.mjs, through
        # scripts/wasm-env.sh) and build. There is no separate build command.
        working-directory: ts
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: ts
        run: npm test

      - name: Pack
        # SKIP_TRLOG_PREPARE: `npm pack` re-runs prepare; the build above is
        # the one that was tested.
        working-directory: ts
        env:
          SKIP_TRLOG_PREPARE: "1"
        run: |
          set -eu
          tgz=$(npm pack --silent | tail -n 1)
          tar -tzf "$tgz" | grep -qx 'package/dist/wasm/trlog.wasm' || {
            echo "::error::$tgz has no dist/wasm/trlog.wasm"; exit 1; }
          mkdir -p ../npm-dist && mv "$tgz" ../npm-dist/
          echo "packed $tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: ./npm-dist/*.tgz

  # ------------------------------------------------------------------------ #
  # The release-authority master switch, resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job -- the value has to
  # arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error, so the publish condition would
  # be false forever: nothing publishes and nothing goes red. `publish` below
  # therefore declares `needs: [gate, ...]` explicitly.
  #
  # fvutils/trlog is not listed in the switch, so it takes the default, which
  # is "github" -- this file is the release path for this package.
  # ------------------------------------------------------------------------ #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. A release blocked by a dvkit.org outage is recoverable
            # in ten minutes; a version published twice from two forges is not,
            # because PyPI lets a version be yanked but never reused.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable on a non-tag ref; nothing to release"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  # Releases only. A tag is the deliberate act; ordinary pushes and PRs build
  # wheels as ARTIFACTS above, which is what makes them reviewable without
  # being publishable.
  #
  # The npm package goes out from the same job, after PyPI: every version
  # check below covers both before either upload, and a re-run after a failed
  # npm upload passes PyPI again (--skip-existing) and retries npm.
  #
  # Every wheel the matrix builds: Linux x86_64 and aarch64 (manylinux_2_28
  # and _2_34), macOS arm64 and x86_64, Windows AMD64, plus the sdist. Each
  # build job is in `needs`, so a release waits for all of them and a failed
  # platform stops it rather than shipping a partial set.
  publish:
    name: Publish to PyPI
    needs: [gate, build_wheels, build_wheels_macos_intel, build_sdist, build_npm]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes the .npmrc that `npm publish` reads NODE_AUTH_TOKEN
          # through; without it the publish fails as unauthenticated.
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      # Kept out of dist/: twine uploads dist/*.
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: npm-dist

      - name: Check the tag matches the package version
        # Guards against tagging v0.2.0 while __version__.py still says 0.1.0,
        # which would publish a release under the wrong number -- unfixably,
        # since PyPI never allows a version to be reused. Same check, and the
        # same kind of source file, as dv-solve's and pssparser's release jobs.
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/v}"
          base=$(python3 -c 'import re; print(re.search(r"BASE\s*=\s*\"([^\"]+)\"", open("python/src/trlog/__version__.py").read()).group(1))')
          suffix=$(python3 -c 'import re; print(re.search(r"SUFFIX\s*=\s*\"([^\"]*)\"", open("python/src/trlog/__version__.py").read()).group(1))')
          echo "tag=$tag  BASE=$base  SUFFIX=$suffix"
          if [ "$tag" != "$base" ]; then
            echo "::error::tag v$tag does not match BASE $base in python/src/trlog/__version__.py"
            exit 1
          fi
          if [ -n "$suffix" ]; then
            echo "::error::SUFFIX is '$suffix' in python/src/trlog/__version__.py; a release needs it empty"
            exit 1
          fi
          nwhl=0
          for f in dist/*.whl dist/*.tar.gz; do
            [ -e "$f" ] || { echo "::error::no $f in dist/"; exit 1; }
            case "$(basename "$f")" in
              trlog-$base-*.whl) nwhl=$((nwhl + 1)) ;;
              trlog-$base.tar.gz) ;;
              *) echo "::error::$(basename "$f") is not version $base"; exit 1 ;;
            esac
          done
          # 4 manylinux + macOS arm64 + macOS x86_64 + Windows AMD64.
          if [ "$nwhl" -lt 7 ]; then
            echo "::error::expected at least 7 wheels, found $nwhl"
            exit 1
          fi
          if [ ! -e "npm-dist/fvutils-trlog-$base.tgz" ]; then
            echo "::error::no npm-dist/fvutils-trlog-$base.tgz (found: $(ls npm-dist))"
            exit 1
          fi
          echo "OK: tag, source version, $nwhl wheels, the sdist and the npm tarball agree on ${base}"

      - name: Publish
        # Plain twine rather than a third-party action: this is the release
        # path, and it should depend on as little as possible. PYPI_API_TOKEN
        # is an org-level secret on the fvutils GitHub org.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -eu
          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "::error::PYPI_API_TOKEN is not set for this repository"
            exit 1
          fi
          python3 -m pip install -U twine
          python3 -m twine check dist/*
          python3 -m twine upload --non-interactive --skip-existing dist/*
          echo "published $(ls dist/*.whl | wc -l) wheels and the sdist"

      - name: Publish to npm
        # The tarball built and tested by build_npm; publishing a tarball runs
        # no lifecycle scripts, so nothing is rebuilt. Access is public
        # (also publishConfig in ts/package.json): a scoped package otherwise
        # defaults to restricted. NPM_TOKEN is an org-level secret. A re-run
        # after this succeeded fails with EPUBLISHCONFLICT: npm never reuses
        # a version, so a half-landed release is recovered with a new tag.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not set for this repository"
            exit 1
          fi
          npm publish ./npm-dist/*.tgz --access public
          echo "published $(ls npm-dist/*.tgz) to npm"
